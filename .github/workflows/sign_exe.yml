name: Test SignPath

on:
  push:
    # Sequence of patterns matched against refs/tags
    branches:
      - 'build_exe'
jobs:
  build:
    name: Build exe with launcher
    runs-on: windows-latest

    steps:
      - name: Set Version
        env:
          VERSION: 0.0.1
        run: echo "Version is set to $VERSION"

      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build OK-EXE
        run: |
          cd src-win-launcher
          msbuild ok-launcher.sln /p:Configuration=Release
          cd ..
          cp src-win-launcher/x64/Release/ok-OverField.exe .

      - name: upload-unsigned-artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: to-sign
          path: |
            ok-OverField.exe

      - name : sign OK-EXE
        uses: signpath/github-action-submit-signing-request@v1.1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: 'a9bdf857-0e93-455b-96a8-070e799f7874'
          project-slug: 'ok-OverField'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: "single-exe"
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: '.'

      - name: upload-signed-artifact
        id: upload-signed-artifact
        uses: actions/upload-artifact@v4
        with:
          path: ok-OverField.exe